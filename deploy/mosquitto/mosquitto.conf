# Demo broker: anonymous access on the compose network only. Do not expose this to the internet.
listener 1883
allow_anonymous true

# Persist sessions and queued QoS 1 messages across broker restarts, so the API's
# persistent session (fixed client ID, clean_session=false) does not lose messages.
persistence true
persistence_location /mosquitto/data/

log_dest stdout

# A location message is ~100 bytes. Refuse anything bigger than the API will decode (ingest.MaxPayloadBytes).
max_packet_size 4096
